<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人名片</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 页面主内容：名片在视口中水平、垂直居中 -->
  <main class="page-shell">
    <article class="profile-card">
      <!-- 使用首字母作为头像占位，替换文字即可换成真实头像内容 -->
      <div class="avatar" aria-label="林默的头像">林</div>

      <div class="profile-content">
        <p class="profile-label">个人名片</p>
        <h1>林默</h1>
        <p class="profile-role">产品设计师</p>

        <!-- 联系方式列表使用语义化地址元素，便于阅读器识别 -->
        <address class="contact-list">
          <a href="mailto:linmo@example.com">
            <span class="contact-icon" aria-hidden="true">✉</span>
            <span>linmo@example.com</span>
          </a>
          <a href="tel:+8613800138000">
            <span class="contact-icon" aria-hidden="true">☎</span>
            <span>+86 138 0013 8000</span>
          </a>
          <a href="https://www.example.com" target="_blank" rel="noreferrer">
            <span class="contact-icon" aria-hidden="true">↗</span>
            <span>www.example.com</span>
          </a>
        </address>
      </div>
    </article>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜀韵·成都 | 首页</title>
<link rel="stylesheet" href="1styles.css">
</head>
<body>
  <header>
    <div class="nav-wrap">
      <div class="logo">蜀韵·成都</div>
      <nav>
        <a href="#">首页</a>
        <a href="media/a.html">美食</a>
        <a href="#">景点</a>
        <a href="#">文化</a>
        <a href="#">交通</a>
      </nav>
    </div>
  </header>

  <div class="banner">
    <div class="slide-item active">
      <img class="banner-img" src="media/banner1.jpg" alt="蜀韵成都封面">
    </div>
    <div class="slide-item">
      <img class="banner-img" src="media/banner5.jpg" alt="旅行攻略">
    </div>
    <div class="slide-item">
      <img class="banner-img" src="media/banner4.jpg" alt="天府文化">
    </div>
    <div class="slide-item">
      <img class="banner-img" src="media/banner3.jpg" alt="必游景点">
    </div>
    <div class="slide-item">
      <img class="banner-img" src="media/banner2.jpg" alt="成都味道">
    </div>
    <div class="dots">
      <div class="dot active" onclick="switchSlide(0)"></div>
      <div class="dot" onclick="switchSlide(1)"></div>
      <div class="dot" onclick="switchSlide(2)"></div>
      <div class="dot" onclick="switchSlide(3)"></div>
      <div class="dot" onclick="switchSlide(4)"></div>
    </div>
  </div>

  <div class="container">
    <div class="title-line">
      <h3>蓉城简介</h3>
      <span></span>
    </div>
    <p class="intro-text">
成都，别称蓉城、锦城，古蜀文明的发祥地。这里慢煮烟火，茶香悠长，可爱的大熊猫是城市名片。武侯祠沉淀三国往事，宽窄巷子藏着老成都的闲适，火锅飘香，川剧婉转，是一座来了就不想离开的城市。
    </p>
  </div>

  <footer>
    <p>蜀韵·成都 文旅宣传网页 | 课程作业</p>
  </footer>

<script>
  let index = 0;
  const slides = document.querySelectorAll('.slide-item');
  const dots = document.querySelectorAll('.dot');
  const total = slides.length;

  function switchSlide(i){
    slides[index].classList.remove('active');
    dots[index].classList.remove('active');
    index = i;
    slides[index].classList.add('active');
    dots[index].classList.add('active');
  }
  //自动轮番
setInterval(()=>{
     let next = (index + 1) % total;
     switchSlide(next);
   },4000)
 </script>
 </body>
</html>
